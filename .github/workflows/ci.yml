name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux 跑全版本矩阵；Windows / macOS 各跑一个代表版本。
        # 这样既覆盖了跨平台差异，又不会因为 macOS runner 排队而卡住 CI
        # （macOS runner 容量紧张，实测会排队 15 分钟以上直至超时）。
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q scripts tests

      - name: 端到端冒烟测试
        run: python tests/smoke_test.py

      - name: 配置模板可解析
        run: |
          python -c "import sys; sys.path.insert(0,'scripts'); import _config; c=_config.load('config.example.toml'); print('config OK:', c['pack']['max_part_mb'], 'MB')"